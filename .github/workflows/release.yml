name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: "Create GitHub release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check the tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version custom_components/lg_therma_v/manifest.json)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match manifest version ${version}" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --generate-notes
